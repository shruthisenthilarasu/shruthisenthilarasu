name: Generate contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate animated contribution snake
        uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/contribution-snake.svg
          theme: blue
          frame: true
          counter: true

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
